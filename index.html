body,main,.card,.modal,.field,.field input,.field select,.field textarea{text-align:start}
.empty,.foot,.nav button,.toast{text-align:center}
.top .header-tools{display:flex;align-items:center;gap:8px;flex:none}

const MAGIC='CARCARE-STUDIO-BACKUP 3';
async function makeBackup(st){let d=clone(st.data),entries=[],payload=[];if(!d.vehicles.length)throw Error(L('أضف مركبة أولاً','Add a vehicle first'));for(let a of d.maintenance_attachments){let blob=st.blobs[a.id];if(!blob||blob.size!==a.file_size_bytes)throw Error(L('مرفق مفقود أو تالف: ','Missing or corrupt attachment: ')+a.filename);let hash=await sha(blob);if(a.sha256&&a.sha256!==hash)throw Error(L('مرفق تالف: ','Corrupt attachment: ')+a.filename);a.sha256=hash;let b64=await toBase64(blob);entries.push({attachmentId:a.id,sizeBytes:blob.size,sha256:hash,base64Length:b64.length});payload.push(b64+'\n')}let manifest=backup.buildBackup({data:d,files:entries,schemaVersion:3,appName:'CarCare Studio',appVersion:'1.2.0',developer:'Muath Al-Khusaibi'}),text=JSON.stringify(manifest).replace(/[\u007f-\uffff]/g,c=>'\\u'+c.charCodeAt(0).toString(16).padStart(4,'0')),validated=backup.parseAndValidateBackup(text,3);if(!validated.ok)throw Error(validated.detail||validated.errorKey);return new Blob([MAGIC+'\n',text+'\n',...payload],{type:'application/octet-stream'})}
async function saveBackup(){if(busy||fatal)return;busy=true;updateSave();try{let rev=state.revision,filename='CarCareStudio-'+today()+'.carcare',handle=null;if(window.showSaveFilePicker){try{handle=await window.showSaveFilePicker({suggestedName:diskHandle?.name||filename,id:'carcare-backup',...(diskHandle?{startIn:diskHandle}:{}),types:[{description:'CarCare Studio Backup',accept:{'application/octet-stream':['.carcare']}}]})}catch(e){if(e.name==='AbortError')return;if(e.name!=='SecurityError'&&e.name!=='NotAllowedError'&&e.name!=='TypeError')throw e}}let blob=await makeBackup(state);if(handle){let writer=await handle.createWritable();try{await writer.write(blob);await writer.close()}catch(e){await writer.abort().catch(()=>{});throw e}diskHandle=handle;let draft=clone(state);draft.backupRevision=rev;await write([['state',draft],['handle',handle]]);state=draft;toast(L('تم حفظ النسخة الاحتياطية','Backup saved'))}else{download(blob,filename);if(confirm(L('تم طلب تنزيل ملف النسخة الاحتياطية. هل تأكدت من حفظه في الملفات؟','Backup download requested. Have you confirmed it is saved in Files?'))){let draft=clone(state);draft.backupRevision=rev;await write([['state',draft]]);state=draft;toast(L('تم تأكيد حفظ النسخة','Backup save confirmed'))}}}finally{busy=false;updateSave()}}
async function parseBackup(file){if(file.size>150*1024*1024)throw Error(L('الحد الحالي للاستيراد 150 MB','Current import limit is 150 MB'));let text=await file.text(),container=text.startsWith(MAGIC+'\n'),lines=container?text.split('\n'):[],manifest=container?lines[1]:text,r=backup.parseAndValidateBackup(manifest,3);if(!r.ok)throw Error(t(r.errorKey)+(r.detail?' · '+r.detail:''));let d=r.backup.data,blobs={};if(r.backup.formatVersion===3){if(!container||lines.length!==r.backup.files.length+3||lines.at(-1)!=='')throw Error(L('حاوية مرفقات غير مكتملة','Incomplete attachment container'));for(let [i,e] of r.backup.files.entries()){let a=d.maintenance_attachments.find(a=>a.id===e.attachmentId),b64=lines[i+2];if(b64.length!==e.base64Length||!/^[A-Za-z0-9+/]+={0,2}$/.test(b64))throw Error('Invalid attachment payload');let raw=atob(b64),bytes=Uint8Array.from(raw,c=>c.charCodeAt(0)),blob=new Blob([bytes],{type:a.mime_type});if(blob.size!==e.sizeBytes||await sha(blob)!==e.sha256||files.sniffMime(bytes.slice(0,32))!==a.mime_type)throw Error(L('مرفق تالف: ','Corrupt attachment: ')+a.filename);blobs[a.id]=blob}}d.settings=d.settings.filter(s=>backup.RESTORABLE_SETTING_KEYS.includes(s.key));return {data:d,blobs}}
async function restoreFile(file){if(!file||busy)return;busy=true;updateSave();try{let imported=await parseBackup(file),d=imported.data;busy=false;updateSave();modal(L('استعادة نسخة احتياطية','Restore backup'),`<div class="stack"><div class="notice warn">${L('ستُستبدل البيانات الحالية بالكامل. ستُحفظ نسخة أمان محلية قبل الاستبدال.','All current data will be replaced. A local safety copy will be saved first.')}</div><div class="card"><p>${L('المركبات','Vehicles')}: <b>${d.vehicles.length}</b></p><p>${L('السجلات','Records')}: <b>${d.maintenance_records.length}</b></p><p>${L('المرفقات','Attachments')}: <b>${d.maintenance_attachments.length}</b></p><p>${L('إجمالي المصروفات','Total expenses')}: <b>${money(total(d.maintenance_records))}</b></p></div></div>`,async()=>{let safety=state.data.vehicles.length?clone(state):null;if(safety)await makeBackup(safety);await commit(st=>{st.data=imported.data;st.blobs=imported.blobs},safety?[['safety',safety]]:[]);navigate('dashboard')},L('تأكيد الاستعادة','Confirm restore'))}finally{busy=false;updateSave()}}
function exportCSV(){let rs=sorted(reportRecords()),h=[L('المركبة','Vehicle'),t('record.date'),t('record.serviceType'),t('record.odometerAtService'),t('cost.labor'),t('cost.parts'),t('cost.legacy'),t('cost.total'),t('record.workshop'),t('record.notes')];let rows=rs.map(r=>[name(data().vehicles.find(v=>v.id===r.vehicle_id)),r.service_date,recordLabel(r),r.odometer_km,r.labor_cost_baisa===null?'':(r.labor_cost_baisa/1000).toFixed(3),r.parts_cost_baisa===null?'':(r.parts_cost_baisa/1000).toFixed(3),r.labor_cost_baisa===null?(r.cost_baisa/1000).toFixed(3):'',(r.cost_baisa/1000).toFixed(3),r.workshop_name||'',recordNotes(r)]);const q=x=>'"'+String(x).replace(/^[=+@\-\t\r]/,"'$&").replaceAll('"','""')+'"';download(new Blob(['\ufeff'+[h,...rows].map(r=>r.map(q).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),'CarCareStudio-report-'+today()+'.csv')}
function printReport(){let rs=sorted(reportRecords()),sum=total(rs),labor=rs.reduce((n,r)=>n+(r.labor_cost_baisa||0),0),parts=rs.reduce((n,r)=>n+(r.parts_cost_baisa||0),0);$('printarea').innerHTML=`<div lang="${ar()?'ar':'en'}" dir="${ar()?'rtl':'ltr'}"><div class="row"><h1>CarCare Studio</h1><img src="${LOGO}" width="56" height="56" alt=""></div><h2>${t('reports.title')} · ${scope==='all'?t('reports.allVehicles'):esc(name(vehicle()))}</h2><p>${esc(reportFilter.from||'—')} — ${esc(reportFilter.to||'—')} | ${today()}</p><div class="row"><b>${t('cost.total')}: ${money(sum)}</b><span>${t('cost.labor')}: ${money(labor)}</span><span>${t('cost.parts')}: ${money(parts)}</span></div><p>${t('cost.legacy')}: ${money(sum-labor-parts)} · ${rs.length} ${L('سجل','records')}</p><table><thead><tr>${[L('المركبة','Vehicle'),t('record.date'),t('record.serviceType'),t('record.odometer'),t('cost.labor'),t('cost.parts'),t('cost.total')].map(s=>`<th>${esc(s)}</th>`).join('')}</tr></thead><tbody>${rs.map(r=>`<tr><td>${esc(name(data().vehicles.find(v=>v.id===r.vehicle_id)))}</td><td>${esc(r.service_date)}</td><td>${esc(recordLabel(r))}</td><td>${num(r.odometer_km)}</td><td>${r.labor_cost_baisa===null?'—':money(r.labor_cost_baisa)}</td><td>${r.parts_cost_baisa===null?'—':money(r.parts_cost_baisa)}</td><td>${money(r.cost_baisa)}</td></tr>`).join('')}</tbody></table><p>${L('تصميم وتطوير: معاذ الخصيبي','Designed & Developed by Muath Al-Khusaibi')}</p></div>`;window.print()}
function render(){theme();let titles={dashboard:['CarCare Studio',new Date().getHours()<12?t('dashboard.goodMorning'):t('dashboard.goodEvening')],history:[t('history.title'),t('history.subtitle')],reports:[t('reports.title'),t('reports.subtitle')],settings:[L('الإعدادات','Settings'),'CarCare Studio'],vehicles:[t('vehicles.title'),L('إدارة مركباتك','Manage vehicles')],schedules:[t('schedules.title'),L('المواعيد الدورية','Service intervals')]};let [title,subtitle]=titles[page]||titles.dashboard;$('header').innerHTML=`${['vehicles','schedules'].includes(page)?btn(icon('back'), 'dashboard','ghost',`aria-label="${esc(t('common.back'))}"`):''}<div class="grow"><h1>${esc(title)}</h1><p>${esc(subtitle)}</p></div><div class="header-tools">${btn(L('EN','العربية'),'languageToggle','lang-switch',`lang="${ar()?'en':'ar'}" dir="${ar()?'ltr':'rtl'}" aria-label="${esc(L('Switch to English','التبديل إلى العربية'))}" title="${esc(L('Switch to English','التبديل إلى العربية'))}"`)}${['vehicles','schedules'].includes(page)?'':`<img class="logo" src="${LOGO}" alt="CarCare Studio">`}</div>`;$('nav').innerHTML=`<div class="navinner">${[['dashboard','home'],['history','history'],['add','plus'],['reports','chart'],['settings','gear']].map(([p,i])=>`<button data-act="${p}" class="${page===p?'active':''} ${p==='add'?'add':''}">${icon(i)}<span>${t('tabs.'+p)}</span></button>`).join('')}</div>`;$('view').innerHTML=fatal?`<div class="notice error">${L('تعذر فتح التخزين. استخدم متصفحًا يسمح بـ IndexedDB ولا تسجل بيانات قبل إصلاحه.','Storage failed. Use a browser that permits IndexedDB; do not enter data until repaired.')}</div>`:({dashboard,history,reports,settings,vehicles,schedules}[page]||dashboard)();$('footer').innerHTML=`CarCare Studio · PWA Edition<br>${L('تصميم وتطوير: معاذ الخصيبي','Designed & Developed by Muath Al-Khusaibi')}`;updateSave()}
function navigate(p){page=p;render();window.scrollTo({top:0,behavior:'instant'})}
async function act(action){let [a,b]=action.split(':');if(fatal&&a!=='close')return;if(a==='close')return closeModal();if(a==='languageToggle')return changeLanguage(ar()?'en':'ar');if(['dashboard','history','reports','settings','vehicles','schedules'].includes(a))return navigate(a);if(a==='vehicle')return vehicleForm(Number(b));if(a==='add')return recordForm();if(a==='editRecord')return recordForm(Number(b));if(a==='record')return recordDetail(Number(b));if(a==='odometer')return odometerForm();if(a==='schedule')return scheduleForm(b);if(a==='recalc'){let f=$('modalForm');f.elements.nextKm.value='';f.elements.nextDate.value='';return}if(a==='activate'){await commit(st=>setSetting(st.data,'active_vehicle_id',Number(b)));return navigate('dashboard')}if(a==='deleteVehicle'){let id=Number(b);if(!confirm(L('حذف المركبة وجميع سجلاتها ومرفقاتها نهائيًا؟','Permanently delete the vehicle and all records and attachments?')))return;await commit(st=>{let d=st.data,ids=new Set(d.maintenance_records.filter(r=>r.vehicle_id===id).map(r=>r.id));for(let x of d.maintenance_attachments.filter(a=>ids.has(a.maintenance_record_id)))delete st.blobs[x.id];d.maintenance_attachments=d.maintenance_attachments.filter(a=>!ids.has(a.maintenance_record_id));d.maintenance_records=d.maintenance_records.filter(r=>!ids.has(r.id));d.maintenance_schedules=d.maintenance_schedules.filter(s=>s.vehicle_id!==id);d.vehicles=d.vehicles.filter(v=>v.id!==id);if(Number(setting('active_vehicle_id'))===id)setSetting(d,'active_vehicle_id',d.vehicles[0]?.id||'')});return}if(a==='deleteRecord'){let id=Number(b),r=data().maintenance_records.find(r=>r.id===id);if(!r||!confirm(t('record.deleteMessage',{name:cat(r.category),date:r.service_date,total:money(r.cost_baisa)})))return;await commit(st=>{let d=st.data;for(let x of d.maintenance_attachments.filter(a=>a.maintenance_record_id===id))delete st.blobs[x.id];d.maintenance_attachments=d.maintenance_attachments.filter(a=>a.maintenance_record_id!==id);d.maintenance_records=d.maintenance_records.filter(x=>x.id!==id);sync(d,r.vehicle_id,r.category)});closeModal();return}if(a==='deleteSchedule'){if(!confirm(t('schedules.deleteMessage',{name:cat(b)})))return;await commit(st=>{st.data.maintenance_schedules=st.data.maintenance_schedules.filter(s=>s.vehicle_id!==vehicle().id||s.category!==b)});closeModal();return}if(a==='attachment'){let id=Number(b),x=data().maintenance_attachments.find(a=>a.id===id),blob=state.blobs[id];if(!x||!blob)throw Error(L('المرفق مفقود','Missing attachment'));modal(x.filename,`<div id="preview" class="stack"></div><div class="actions">${btn(L('تنزيل المرفق','Download attachment'),'downloadAttachment:'+id,'primary')}${btn(L('رجوع للسجل','Back to record'),'record:'+x.maintenance_record_id)}</div>`);let url=URL.createObjectURL(blob);objectUrls.push(url);if(x.attachment_type==='image')$('preview').innerHTML=`<img class="preview" src="${url}" alt="${esc(x.filename)}">`;else $('preview').innerHTML=`<iframe title="PDF" src="${url}" style="width:100%;height:55vh;border:0"></iframe>`;return}if(a==='downloadAttachment'){let x=data().maintenance_attachments.find(a=>a.id===Number(b));if(x&&state.blobs[x.id])download(state.blobs[x.id],x.filename);return}if(a==='backup')return saveBackup();if(a==='import'){ $('importFile').click();return}if(a==='safety'){let s=await get('safety');if(!s){toast(L('لا توجد نسخة أمان','No safety copy'));return}if(!confirm(L('استبدال البيانات بآخر نسخة أمان؟','Replace data with last safety copy?')))return;let cur=clone(state);if(cur.data.vehicles.length)await makeBackup(cur);await commit(st=>{st.data=s.data;st.blobs=s.blobs},[['safety',cur]]);navigate('dashboard');return}if(a==='persist'){let yes=await navigator.storage?.persist?.();toast(yes?L('تم منح التخزين الدائم','Persistent storage granted'):L('المتصفح لم يمنح التخزين الدائم؛ احتفظ بنسخة خارجية','Persistent storage not granted; keep external backups'));return}if(a==='resetFilters'){filters={q:'',cat:'',sort:'date',order:'desc',from:'',to:''};render();return}if(a==='period'){period=b;render();return}if(a==='csv')return exportCSV();if(a==='pdf')return printReport()}
document.addEventListener('click',e=>{let button=e.target.closest('[data-act]');if(!button)return;e.preventDefault();if(busy&&button.dataset.act!=='close')return;act(button.dataset.act).catch(err)});
document.addEventListener('change',e=>{let el=e.target;if(el.id==='activeVehicle'){if(filters.cat.startsWith('custom:'))filters.cat='';commit(st=>setSetting(st.data,'active_vehicle_id',el.value)).catch(err);}else if(el.matches('[data-setting]')){if(el.name==='language'){changeLanguage(el.value).catch(err);return}if(el.type==='number'&&(!el.value||!Number.isSafeInteger(Number(el.value))||Number(el.value)<0)){render();return}commit(st=>setSetting(st.data,el.name,el.value)).catch(err)}else if(el.matches('[data-filter]')){filters[el.name]=el.value;render()}else if(el.id==='reportScope'){scope=el.value;render()}else if(el.matches('[data-report]')){reportFilter[el.name]=el.value;render()}else if(el.id==='importFile'){let f=el.files[0];el.value='';restoreFile(f).catch(err)}});
document.addEventListener('input',e=>{if(e.target.id==='searchHistory'){filters.q=e.target.value;let tmp=document.createElement('div');tmp.innerHTML=history();$('historyResults').innerHTML=tmp.querySelector('#historyResults').innerHTML}});

let pwaState='pending';
function pwaMessage(){
 if(pwaState==='ready')return L('التطبيق جاهز للعمل دون إنترنت.','App is ready for offline use.');
 if(pwaState==='local')return L('افتح التطبيق من رابط HTTPS لتفعيل التثبيت والعمل دون إنترنت.','Open the app from an HTTPS URL to enable installation and offline use.');
 if(pwaState==='error')return L('لم يكتمل إعداد العمل دون إنترنت؛ تحقق من الاتصال وأعد فتح الصفحة.','Offline setup failed; check your connection and reopen the page.');
 return L('جارٍ إعداد العمل دون إنترنت…','Preparing offline access…');
}
function setPwaState(v){pwaState=v;const el=document.getElementById('pwaStatus');if(el)el.textContent=pwaMessage()}
async function startPwa(){
 if(!isSecureContext||location.protocol==='file:'||!('serviceWorker' in navigator)){setPwaState('local');return}
 try{
  const registration=await navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'});
  if(registration.active)setPwaState('ready');
  const observe=worker=>{if(!worker)return;const check=()=>{if(worker.state==='activated')setPwaState('ready');else if(worker.state==='redundant'&&!registration.active)setPwaState('error')};worker.addEventListener('statechange',check);check()};
  observe(registration.installing);observe(registration.waiting);
  registration.addEventListener('updatefound',()=>observe(registration.installing));
  navigator.serviceWorker.ready.then(()=>setPwaState('ready'));
 }catch(e){console.warn('PWA registration failed',e);setPwaState('error')}
}
window.addEventListener('load',startPwa,{once:true});

(async()=>{try{db=await openDB();let saved=await get('state');if(saved)state=saved;diskHandle=await get('handle');render();}catch(e){fatal=true;render();err(e)}})();
